# Publishes the Alathar website (website/public: home/support + privacy policy)
# to Firebase Hosting, project "alathar-14555", whenever it changes on main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_ALATHAR_14555 (the JSON
# key of a Firebase service account that may deploy Hosting).
name: Deploy website to Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALATHAR_14555 }}
          channelId: live
          projectId: alathar-14555
          entryPoint: website
