# Builds the Alathar web app (Flutter web) and publishes it with the static
# pages (website/public: /support and /privacy) to Firebase Hosting, project
# "alathar-14555" → https://alathar-14555.web.app
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_ALATHAR_14555 (the JSON
# key of a Firebase service account that may deploy Hosting).
name: Deploy Alathar web to Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'web/**'
      - 'website/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the web app
        run: |
          flutter pub get
          flutter build web --release
      - name: Add the static pages
        run: |
          rm -rf website/dist
          mkdir -p website/dist
          cp -r build/web/. website/dist/
          cp website/public/support.html website/public/privacy.html website/public/404.html website/dist/
          cp -r website/public/site website/dist/site
      - name: Check the Firebase key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALATHAR_14555 }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_ALATHAR_14555 is missing or empty"; exit 1
          fi
          echo "$SA" | python3 -c "import json,sys; k=json.load(sys.stdin); print('::notice::Firebase key OK: project', k.get('project_id'), '·', k.get('client_email'))" \
            || { echo "::error::The secret is not a valid service-account JSON (paste the whole .json file)"; exit 1; }
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALATHAR_14555 }}
        working-directory: website
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@latest deploy --only hosting --project alathar-14555 --non-interactive > "$RUNNER_TEMP/deploy.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $code -ne 0 ]; then
            # Show the reason in the run summary (readable without signing in).
            grep -iE "error|denied|permission|not found|enable|403|404" "$RUNNER_TEMP/deploy.log" | tail -n 8 | while read -r line; do echo "::error::$line"; done
            exit $code
          fi
